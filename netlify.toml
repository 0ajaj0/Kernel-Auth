[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install --omit=dev"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/v1-router?endpoint=:splat"
  status = 200

[[redirects]]
  from = "/api/v2/*"
  to = "/.netlify/functions/v2-router?endpoint=:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/oauth/start/*"
  to = "/.netlify/functions/oauth-start"
  status = 200

[[redirects]]
  from = "/oauth/callback/*"
  to = "/oauth/callback.html"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/admin/dashboard/:splat"
  status = 302

[[redirects]]
  from = "/dashboard"
  to = "/admin/dashboard/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
