<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — KERNEL Auth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/authlyx-dashboard.css" />
</head>
<body>
  <div id="loadingView" style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--ax-muted)">
    <div style="text-align:center">
      <div class="logo-icon" style="width:48px;height:48px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;margin:0 auto 16px;color:#fff">K</div>
      <div>Loading dashboard...</div>
    </div>
  </div>
  <div id="loginView" class="login-wrap hidden">
    <div class="login-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
        <div class="logo-icon" style="width:40px;height:40px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800">K</div>
        <div><div style="font-weight:700;font-size:18px">KERNEL Auth</div><div style="font-size:12px;color:var(--ax-muted)">Admin Dashboard</div></div>
      </div>
      <div class="field">
        <label>Admin Email</label>
        <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="email" />
      </div>
        <label>Admin Password</label>
        <input type="password" id="loginPassword" placeholder="Admin password" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" id="loginBtn" style="width:100%">Sign In</button>
      <p id="loginError" class="hidden" style="color:var(--ax-red);font-size:13px;margin-top:12px"></p>
      <p style="margin-top:16px;font-size:12px;color:var(--ax-muted)"><a href="/login/">Customer login →</a></p>
    </div>
  </div>

  <div id="appView" class="ax-app hidden">
    <aside class="ax-sidebar">
      <div class="ax-brand">
        <div class="logo-icon">K</div>
        <div class="logo-text">KERNEL</div>
      </div>
      <div class="ax-mode-toggle">
        <button id="modeApp" class="active" type="button">APP</button>
        <button id="modeTeam" type="button">TEAM</button>
      </div>
      <nav class="ax-nav" id="nav"></nav>
      <div class="ax-sidebar-user">
        <div class="ax-avatar" id="userAvatar">M</div>
        <div class="info">
          <div class="name" id="userName">Admin</div>
          <div class="tier">★ Admin</div>
        </div>
        <button class="btn btn-ghost btn-icon" id="logoutBtn" title="Sign out">⏻</button>
      </div>
    </aside>
    <div class="ax-main">
      <header class="ax-topbar">
        <div class="ax-app-select">
          <span style="color:var(--ax-blue)">●</span>
          <select id="appSelectorTop"></select>
        </div>
        <div class="ax-topbar-links">
          <a href="#" id="linkInvites">Invites</a>
          <a href="/docs/">Docs</a>
          <a href="#" id="linkSupport">Support</a>
          <a href="https://discord.com" target="_blank" rel="noopener">Discord</a>
        </div>
        <div class="ax-notif">🔔<span class="dot"></span></div>
        <div class="ax-topbar-user">
          <span class="name" id="topUserName">Admin</span>
          <div class="ax-avatar" style="width:32px;height:32px;font-size:12px;display:flex;align-items:center;justify-content:center" id="topAvatar">M</div>
        </div>
      </header>
      <div class="ax-content" id="pageContent"></div>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="/assets/js/auth-guard.js"></script>
  <script>
    KernelAuth.guardRoute('ADMIN', '/unauthorized/').then((session) => {
      if (!session) return;
      if (session.session.role !== 'ADMIN') return;
      const s = document.createElement('script');
      s.src = '/assets/js/authlyx-app.js?v=5';
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
