<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — KERNEL Auth</title>
  <link rel="stylesheet" href="/assets/css/kernel.css" />
  <style>
    .admin-grid { display: grid; gap: 12px; margin-top: 20px; }
    .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
    .field input, .field select {
      width: 100%; padding: 12px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text);
    }
    .key-list { margin-top: 20px; max-height: 220px; overflow: auto; }
    .key-item {
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 8px; font-size: 12px; background: var(--bg-elevated);
    }
    .card { max-width: 520px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">KERNEL</div>
    <h1>Admin Panel</h1>
    <p class="subtitle">Create license keys for your loader users. Keys are stored securely on Netlify Blobs.</p>

    <div class="field">
      <label>Admin password</label>
      <input type="password" id="adminKey" placeholder="KERNEL_ADMIN_PASSWORD" />
    </div>

    <div class="admin-grid">
      <div class="field">
        <label>License key (auto if empty)</label>
        <input type="text" id="licenseKey" placeholder="KERNEL-XXXX-XXXX" />
      </div>
      <div class="field">
        <label>Subscription name</label>
        <input type="text" id="subscription" value="KERNEL Premium" />
      </div>
      <div class="field">
        <label>Max activations</label>
        <input type="number" id="maxActivations" value="1" min="1" />
      </div>
    </div>

    <button class="btn btn-primary" id="createBtn" type="button" style="margin-top:16px">Create License Key</button>
    <button class="btn btn-ghost" id="refreshBtn" type="button">Refresh Key List</button>
    <p class="error-text hidden" id="msg"></p>
    <div class="key-list" id="keyList"></div>
  </div>
  <script>
    const msg = document.getElementById('msg');
    const adminKey = document.getElementById('adminKey');

    function headers() {
      return {
        'Content-Type': 'application/json',
        'X-Kernel-Admin-Key': adminKey.value,
      };
    }

    function randomKey() {
      const part = () => Math.random().toString(36).substring(2, 6).toUpperCase();
      return `KERNEL-${part()}-${part()}-${part()}`;
    }

    document.getElementById('createBtn').onclick = async () => {
      msg.classList.add('hidden');
      const license_key = document.getElementById('licenseKey').value.trim() || randomKey();
      const res = await fetch('/api/admin-keys', {
        method: 'POST',
        headers: headers(),
        body: JSON.stringify({
          license_key,
          subscription: document.getElementById('subscription').value,
          max_activations: Number(document.getElementById('maxActivations').value) || 1,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        msg.textContent = data.error || 'Failed';
        msg.classList.remove('hidden');
        return;
      }
      document.getElementById('licenseKey').value = data.license_key;
      msg.textContent = `Created: ${data.license_key}`;
      msg.classList.remove('hidden');
      msg.className = 'success-text';
      refresh();
    };

    async function refresh() {
      const res = await fetch('/api/admin-keys', { headers: headers() });
      const data = await res.json();
      const list = document.getElementById('keyList');
      if (!res.ok) {
        list.innerHTML = `<div class="key-item">${data.error || 'Unauthorized'}</div>`;
        return;
      }
      list.innerHTML = (data.keys || []).map(k => `
        <div class="key-item">
          <strong>${k.key}</strong><br/>
          ${k.subscription || ''} · activations ${k.activations || 0}/${k.max_activations || 1}
        </div>
      `).join('') || '<div class="key-item">No keys yet</div>';
    }

    document.getElementById('refreshBtn').onclick = refresh;
  </script>
</body>
</html>
