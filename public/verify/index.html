<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verifying — KERNEL Auth</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #0D0F12; --panel: #15181E; --border: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --blue: #3B82F6; --cyan: #06B6D4; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text);
      background: radial-gradient(ellipse 50% 40% at 50% 0%, rgba(59,130,246,0.12), transparent), var(--bg);
    }
    .card {
      width: 420px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; padding: 36px; text-align: center;
    }
    .shield {
      width: 56px; height: 56px; margin: 0 auto 20px; position: relative;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .shield svg { width: 56px; height: 56px; color: var(--blue); }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: var(--muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .progress { height: 4px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
    .progress-bar {
      height: 100%; width: 0%; background: linear-gradient(90deg, var(--blue), var(--cyan));
      border-radius: 999px; transition: width 0.4s ease;
    }
    .status { font-size: 13px; color: var(--cyan); font-weight: 500; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="shield">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2L4 5v6c0 5.25 3.5 10 8 11 4.5-1 8-5.75 8-11V5l-8-3z"/>
      </svg>
    </div>
    <h1 id="title">Completing Security Checks...</h1>
    <p id="subtitle">Verifying Session</p>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div class="status" id="status">Initializing JWT cookie context…</div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const redirect = params.get('redirect') || sessionStorage.getItem('kernel_auth_role') === 'ADMIN'
        ? '/admin/dashboard/' : '/client/dashboard/';

      const bar = document.getElementById('progressBar');
      const status = document.getElementById('status');
      const steps = [
        'Initializing JWT cookie context…',
        'Verifying OAuth session…',
        'Checking role permissions…',
        'Preparing dashboard…',
      ];
      let i = 0;
      const tick = setInterval(() => {
        bar.style.width = Math.min(100, ((i + 1) / steps.length) * 100) + '%';
        if (i < steps.length) status.textContent = steps[i];
        i++;
        if (i > steps.length) {
          clearInterval(tick);
          setTimeout(() => { window.location.href = redirect; }, 300);
        }
      }, 375);

      setTimeout(() => {
        const role = sessionStorage.getItem('kernel_auth_role');
        const target = params.get('redirect') || (role === 'ADMIN' ? '/admin/dashboard/' : '/client/dashboard/');
        window.location.href = target;
      }, 1500);
    })();
  </script>
</body>
</html>
