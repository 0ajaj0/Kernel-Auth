<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Dashboard — KERNEL Auth</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/authlyx-dashboard.css" />
  <style>
    .client-wrap { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    .client-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
    .client-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .client-card {
      background: var(--ax-panel, #15181E); border: 1px solid var(--ax-border, #1e293b);
      border-radius: 12px; padding: 20px;
    }
    .client-card h3 { font-size: 14px; color: var(--ax-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: .05em; }
    .client-card .value { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .pill.active { background: rgba(34,197,94,.15); color: #22c55e; }
    .pill.unbound { background: rgba(148,163,184,.15); color: #94a3b8; }
    .pill.pending { background: rgba(251,191,36,.15); color: #fbbf24; }
    .key-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      background: rgba(0,0,0,.2); border-radius: 8px; margin-top: 8px; font-family: monospace; font-size: 13px;
    }
    .key-row button { margin-left: auto; }
    .var-list { font-size: 13px; color: var(--ax-muted); }
    .var-list div { padding: 6px 0; border-bottom: 1px solid var(--ax-border); }
    .download-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--ax-border); }
    .user-bar { display: flex; align-items: center; gap: 12px; }
    .user-bar img { width: 40px; height: 40px; border-radius: 50%; }
  </style>
</head>
<body style="background:var(--ax-bg,#0D0F12);color:var(--ax-text,#f1f5f9);min-height:100vh">
  <div class="client-wrap">
    <div class="client-header">
      <div class="user-bar">
        <div class="ax-avatar" id="avatar">U</div>
        <div>
          <div style="font-weight:700;font-size:18px" id="displayName">Loading…</div>
          <div style="font-size:13px;color:var(--ax-muted)" id="userEmail"></div>
        </div>
      </div>
      <div style="display:flex;gap:10px">
        <a href="/" class="btn btn-ghost">Home</a>
        <button class="btn btn-ghost" id="logoutBtn">Sign Out</button>
      </div>
    </div>

    <div class="client-grid">
      <div class="client-card">
        <h3>Subscription</h3>
        <div class="value" id="subLabel">Free</div>
        <button class="btn btn-primary" id="upgradeBtn">Upgrade Subscription</button>
      </div>
      <div class="client-card">
        <h3>HWID Status</h3>
        <div class="value"><span class="pill unbound" id="hwidPill">Unbound</span></div>
        <p style="font-size:13px;color:var(--ax-muted);margin:8px 0" id="hwidValue">No device bound</p>
        <button class="btn btn-ghost" id="hwidResetBtn">Request HWID Reset</button>
      </div>
      <div class="client-card" style="grid-column:1/-1">
        <h3>License Keys</h3>
        <div id="keysList"><p style="color:var(--ax-muted);font-size:13px">No keys assigned yet</p></div>
      </div>
      <div class="client-card">
        <h3>Cloud Variables</h3>
        <div class="var-list" id="varsList"><p style="color:var(--ax-muted)">None assigned</p></div>
      </div>
      <div class="client-card">
        <h3>Downloads</h3>
        <div id="downloadsList"></div>
      </div>
      <div class="client-card">
        <h3>API Token</h3>
        <div class="key-row">
          <span id="apiToken" style="overflow:hidden;text-overflow:ellipsis">—</span>
          <button class="btn btn-ghost btn-sm" id="copyTokenBtn">Copy</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="/assets/js/auth-guard.js"></script>
  <script src="/assets/js/client-app.js?v=1"></script>
</body>
</html>
