<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — KERNEL Auth</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/landing.css" />
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-card {
      width: 100%; max-width: 420px; background: var(--panel, #15181E);
      border: 1px solid var(--border, #1e293b); border-radius: 16px; padding: 32px;
    }
    .auth-card h1 { font-size: 22px; margin-bottom: 6px; }
    .auth-card p { color: var(--muted, #94a3b8); font-size: 14px; margin-bottom: 24px; }
    .oauth-btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border, #1e293b);
      background: #0f1218; color: var(--text, #f1f5f9); font-size: 14px; font-weight: 500;
      cursor: pointer; margin-bottom: 10px; transition: border-color .2s, background .2s;
    }
    .oauth-btn:hover { border-color: #3b82f6; background: #12161f; }
    .oauth-btn:disabled { opacity: .5; cursor: not-allowed; }
    .oauth-btn.google { background: #fff; color: #1f2937; border-color: #e5e7eb; }
    .oauth-btn.google:hover { background: #f9fafb; }
    .oauth-btn.discord { background: #5865F2; border-color: #5865F2; color: #fff; }
    .oauth-btn.github { background: #24292e; border-color: #24292e; color: #fff; }
    .divider { text-align: center; color: var(--muted); font-size: 12px; margin: 18px 0; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: #0f1218; color: var(--text); font-size: 14px;
    }
    .toggle-link { color: #3b82f6; cursor: pointer; font-size: 13px; margin-top: 12px; display: inline-block; }
    .error { color: #ef4444; font-size: 13px; margin-top: 12px; }
    .back { display: inline-block; margin-bottom: 16px; color: var(--muted); font-size: 13px; text-decoration: none; }
    .back:hover { color: var(--text); }
    .role-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .role-tab {
      flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer; font-size: 13px;
    }
    .role-tab.active { border-color: #3b82f6; color: #3b82f6; background: rgba(59,130,246,.08); }
  </style>
</head>
<body>
  <div class="auth-card">
    <a class="back" href="/">← Back to home</a>
    <h1>Welcome to KERNEL</h1>
    <p id="authSubtitle">Sign in to access your dashboard</p>

    <div class="role-tabs">
      <button type="button" class="role-tab active" data-role="customer">Customer</button>
      <button type="button" class="role-tab" data-role="admin">Admin</button>
    </div>

    <div id="oauthButtons">
      <button type="button" class="oauth-btn google" id="btnGoogle">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303C33.654 32.657 29.083 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C33.64 6.053 29.082 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 16.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C33.64 6.053 29.082 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.066 0-9.426-3.317-10.876-7.946l-6.52 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
        Sign in with Google
      </button>
      <button type="button" class="oauth-btn discord" id="btnDiscord">Sign in with Discord</button>
      <button type="button" class="oauth-btn github" id="btnGitHub">Sign in with GitHub</button>
    </div>

    <div class="divider" id="emailDivider" style="display:none;">— admin login —</div>

    <div id="emailForm" style="display:none;">
      <div class="field">
        <label>Email</label>
        <input type="email" id="emailInput" placeholder="admin@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" style="width:100%" id="emailSubmit">Sign In</button>
    </div>

    <p class="error hidden" id="authError"></p>
  </div>

  <script src="/assets/js/auth-guard.js"></script>
  <script>
    (function () {
      let role = 'customer';
      let config = null;

      const params = new URLSearchParams(location.search);
      const callbackUrl = params.get('callbackUrl') || '';
      const oauthError = params.get('oauth_error');

      function showError(msg) {
        const el = document.getElementById('authError');
        el.textContent = msg;
        el.classList.remove('hidden');
      }

      function oauthEnabled(provider) {
        return config?.oauth?.[provider]?.enabled;
      }

      function startOAuth(provider) {
        if (!oauthEnabled(provider)) {
          showError(provider.charAt(0).toUpperCase() + provider.slice(1) + ' OAuth is not configured on the server.');
          return;
        }
        KernelAuth.startOAuth(provider, 'CUSTOMER');
      }

      function updateUI() {
        const isCustomer = role === 'customer';
        document.getElementById('authSubtitle').textContent = isCustomer ? 'Sign in to access your customer portal' : 'Sign in to access admin dashboard';
        document.getElementById('oauthButtons').style.display = isCustomer ? 'block' : 'none';
        document.getElementById('emailForm').style.display = isCustomer ? 'none' : 'block';
        document.getElementById('emailDivider').style.display = isCustomer ? 'none' : 'block';
      }

      document.querySelectorAll('.role-tab').forEach((tab) => {
        tab.addEventListener('click', () => {
          role = tab.dataset.role;
          document.querySelectorAll('.role-tab').forEach((t) => t.classList.toggle('active', t === tab));
          updateUI();
        });
      });

      document.getElementById('btnGoogle').onclick = () => startOAuth('google');
      document.getElementById('btnDiscord').onclick = () => startOAuth('discord');
      document.getElementById('btnGitHub').onclick = () => startOAuth('github');

      document.getElementById('emailSubmit').onclick = async () => {
        document.getElementById('authError').classList.add('hidden');
        if (role === 'admin') {
          const email = document.getElementById('emailInput').value;
          const pass = document.getElementById('passwordInput').value;
          const res = await fetch('/api/admin-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: pass }),
          });
          const data = await res.json();
          if (!res.ok) { showError(data.error || 'Invalid credentials'); return; }
          KernelAuth.saveSession({ token: data.token, role: data.role || 'ADMIN' });
          location.href = callbackUrl || data.redirect || '/admin/dashboard/';
          return;
        }
      };

      document.getElementById('passwordInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('emailSubmit').click();
      });

      if (oauthError) {
        showError(oauthError.replace(/_/g, ' ') + ' — check Netlify environment variables.');
        history.replaceState({}, '', location.pathname + (callbackUrl ? '?callbackUrl=' + encodeURIComponent(callbackUrl) : ''));
      }

      fetch('/api/config').then((r) => r.json()).then((d) => { config = d; }).catch(() => {});

      KernelAuth.verifySession().then((s) => {
        if (!s) return;
        if (s.session.role === 'ADMIN') location.href = callbackUrl || '/admin/dashboard/';
        else location.href = callbackUrl || '/client/dashboard/';
      });
    })();
  </script>
</body>
</html>
