<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — KERNEL Auth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/authlyx-dashboard.css" />
</head>
<body>
  <!-- Login -->
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
        <div class="logo-icon" style="width:40px;height:40px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800">K</div>
        <div><div style="font-weight:700;font-size:18px">KERNEL Auth</div><div style="font-size:12px;color:var(--ax-muted)">Software Licensing, Done Right</div></div>
      </div>
      <button class="btn-google" id="googleLoginBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303C33.654 32.657 29.083 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C33.64 6.053 29.082 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 16.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C33.64 6.053 29.082 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.066 0-9.426-3.317-10.876-7.946l-6.52 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
        Continue with Google
      </button>
      <div class="divider">— or admin login —</div>
      <div class="field">
        <label>Admin Password</label>
        <input type="password" id="loginPassword" placeholder="Admin password" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" id="loginBtn" style="width:100%">Sign In</button>
      <p id="loginError" class="hidden" style="color:var(--ax-red);font-size:13px;margin-top:12px"></p>
    </div>
  </div>

  <!-- App -->
  <div id="appView" class="ax-app hidden">
    <aside class="ax-sidebar">
      <div class="ax-brand">
        <div class="logo-icon">K</div>
        <div class="logo-text">KERNEL</div>
      </div>
      <div class="ax-mode-toggle">
        <button id="modeApp" class="active" type="button">APP</button>
        <button id="modeTeam" type="button">TEAM</button>
      </div>
      <nav class="ax-nav" id="nav"></nav>
      <div class="ax-sidebar-user">
        <div class="ax-avatar" id="userAvatar">M</div>
        <div class="info">
          <div class="name" id="userName">Admin</div>
          <div class="tier">★ Plus</div>
        </div>
        <button class="btn btn-ghost btn-icon" id="logoutBtn" title="Sign out">⏻</button>
      </div>
    </aside>
    <div class="ax-main">
      <header class="ax-topbar">
        <div class="ax-app-select">
          <span style="color:var(--ax-blue)">●</span>
          <select id="appSelectorTop"></select>
        </div>
        <div class="ax-topbar-links">
          <a href="#" id="linkInvites">Invites</a>
          <a href="/sdk/README.md" target="_blank">Docs</a>
          <a href="#" id="linkSupport">Support</a>
          <a href="https://discord.com" target="_blank" rel="noopener">Discord</a>
        </div>
        <div class="ax-notif">🔔<span class="dot"></span></div>
        <div class="ax-topbar-user">
          <span class="name" id="topUserName">Admin</span>
          <div class="ax-avatar" style="width:32px;height:32px;font-size:12px;display:flex;align-items:center;justify-content:center" id="topAvatar">M</div>
        </div>
      </header>
      <div class="ax-content" id="pageContent"></div>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="/assets/js/authlyx-app.js?v=1"></script>
</body>
</html>
